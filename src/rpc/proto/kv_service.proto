syntax = "proto3";
package foskv.client;

message PutRequest {
    bytes key = 1;
    bytes value = 2;
}

message PutResponse {
    bool success = 1;
    bytes error = 2;
}

message GetRequest {
    bytes key = 1;
}

message GetResponse {
    optional bytes value = 1;
    bytes error = 2;
}

message DeleteRequest {
    bytes key = 1;
}

message DeleteResponse {
    bool success = 1;
    bytes error = 2;
}

message Command {
    oneof Op {
        PutRequest put = 1;
        GetRequest get = 2;
        DeleteRequest delete= 3;
    }
}