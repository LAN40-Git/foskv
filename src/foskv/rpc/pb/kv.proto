syntax = "proto3";
package foskv.kv;
import "rpc.proto";

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  rpc.ResponseHeader header = 1;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  rpc.ResponseHeader header = 1;
  KeyValue kv = 2;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  rpc.ResponseHeader header = 1;
}