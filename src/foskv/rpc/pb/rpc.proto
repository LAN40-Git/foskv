syntax = "proto3";
package foskv.rpc;

message Redirect {
  bytes host = 1;
  uint32 port = 2;
}

message RpcHeader {
  uint64 request_id = 1;
  bytes service_name = 2;
  bytes method_name = 3;
  uint32 payload_size = 4;
}

message ResponseHeader {
  bool success = 1;
  uint32 error_code = 2;
  optional Redirect redirect = 3;
}
