syntax = "proto3";
package foskv.storage;

message ResponseHeader {
  bool success = 1;
  string error = 2;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  ResponseHeader header = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  ResponseHeader header = 1;
  string value = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  ResponseHeader header = 1;
}