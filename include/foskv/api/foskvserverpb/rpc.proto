syntax = "proto3";
package foskvserverpb;

message ResponseHeader {
  uint64 cluster_id = 1;
  uint64 member_id = 2;
  uint64 term = 3;
}

// ===== KV =====
message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  bool prev_kv = 3;
}

message PutResponse {
  ResponseHeader header = 1;
  KeyValue prev_kv = 2;
  bool success = 3;
  bytes error = 4;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  ResponseHeader header = 1;
  KeyValue kvs = 2;
  bool success = 3;
  bytes error = 4;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  ResponseHeader header = 1;
  bool success = 3;
  bytes error = 4;
}
